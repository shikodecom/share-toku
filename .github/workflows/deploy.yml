name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://share-toku.shikode.com
    env:
      RELEASE_ID: ${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      DEPLOY_PHP: ${{ vars.PRODUCTION_PHP_BIN || 'php' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip superseded commits
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_sha" == "$TESTED_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping a commit superseded on main.'
          fi
      - uses: shivammathur/setup-php@v2
        if: steps.revision.outputs.current == 'true'
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
      - name: Build release
        if: steps.revision.outputs.current == 'true'
        run: |
          set -euo pipefail
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          mkdir -p "$RUNNER_TEMP/release"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release"
          cp -a vendor "$RUNNER_TEMP/release/vendor"
          rm -rf "$RUNNER_TEMP/release/.github" "$RUNNER_TEMP/release/tests" "$RUNNER_TEMP/release/wordpress-plugin"
          tar -czf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release" .
      - name: Configure SSH
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_PATH" != / && "$DEPLOY_PATH" != *..* ]]
          [[ "$DEPLOY_PHP" =~ ^[a-zA-Z0-9_./-]+$ ]]
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        if: steps.revision.outputs.current == 'true'
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$current_sha" == "$TESTED_SHA" ]] || { echo 'main advanced before deployment'; exit 1; }
          ssh_options=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/incoming'"
          scp "${ssh_options[@]}" -P "$DEPLOY_PORT" "$RUNNER_TEMP/release.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/incoming/$RELEASE_ID.tar.gz"
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$RELEASE_ID' '$DEPLOY_PHP'" < scripts/deploy.sh
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
