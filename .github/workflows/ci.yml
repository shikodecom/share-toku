name: CI
on: [push, pull_request]
jobs:
  mysql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sharetoku
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sharetoku
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan migrate:rollback --force
      - run: php artisan migrate --force
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress
      - run: php artisan test --compact --do-not-cache-result
      - run: composer audit
      - run: php -l wordpress-plugin/sharetoku/sharetoku.php
      - run: php -l wordpress-plugin/sharetoku/includes/class-sharetoku-plugin.php
      - run: php wordpress-plugin/sharetoku/tests/render.php
      - run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wordpress-plugin/sharetoku/package-lock.json
      - run: npm ci --prefix wordpress-plugin/sharetoku
      - run: npm run build --prefix wordpress-plugin/sharetoku
      - run: git diff --exit-code -- wordpress-plugin/sharetoku/build
      - run: node wordpress-plugin/sharetoku/tests/frontend.cjs
      - run: node wordpress-plugin/sharetoku/tests/block.cjs
      - run: npm audit --prefix wordpress-plugin/sharetoku --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
